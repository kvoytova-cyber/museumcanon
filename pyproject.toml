[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "museumcanon"
version = "0.1.0"
description = "Группа художников в коллекции и выставках музея: читалка данных, предобработка, визуализация"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "networkx>=3.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "requests>=2.28",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
network = ["pyvis>=0.3"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["museumcanon"]
